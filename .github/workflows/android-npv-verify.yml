name: AICP VPN Android and NPV Import Verification

on:
  push:
    branches: [main]
    paths:
      - 'AndroidLibPantegnos/**'
      - 'app/src/main/java/com/v2ray/ang/ui/main/MainActivity.kt'
      - 'app/src/main/java/com/v2ray/ang/ui/main/AicpNpvProfileExtractor.kt'
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/test/java/com/v2ray/ang/ui/main/AicpNpvProfileExtractorTest.kt'
      - 'app/build.gradle.kts'
      - 'scripts/build-aicp-npv-aar.sh'
      - '.github/workflows/android-npv-verify.yml'
  pull_request:
    paths:
      - 'AndroidLibPantegnos/**'
      - 'app/src/main/java/com/v2ray/ang/ui/main/MainActivity.kt'
      - 'app/src/main/java/com/v2ray/ang/ui/main/AicpNpvProfileExtractor.kt'
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/test/java/com/v2ray/ang/ui/main/AicpNpvProfileExtractorTest.kt'
      - 'app/build.gradle.kts'
      - 'scripts/build-aicp-npv-aar.sh'
      - '.github/workflows/android-npv-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-npv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache-dependency-path: AndroidLibPantegnos/go.sum
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          test -d /usr/local/lib/android/sdk/platforms/android-37.0
          test -d /usr/local/lib/android/sdk/build-tools/37.0.0
          test -d /usr/local/lib/android/sdk/ndk/27.3.13750724
      - name: Test the isolated MIT NPV core
        working-directory: AndroidLibPantegnos
        run: |
          go vet ./...
          go test ./...
      - name: Fetch pinned native runtimes
        run: scripts/fetch-pinned-native-runtime-assets.sh
      - name: Fetch pinned Xray AAR
        run: scripts/fetch-pinned-xray-aar.sh
      - name: Build local NPV Android AAR
        run: scripts/build-aicp-npv-aar.sh
      - name: Run Android unit and regression tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --no-parallel --max-workers=2 --console=plain
      - name: Upload generated NPV AAR
        uses: actions/upload-artifact@v4
        with:
          name: aicpnpv-android-aar
          path: app/libs/aicpnpv.aar
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
