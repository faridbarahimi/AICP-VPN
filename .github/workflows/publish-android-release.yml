name: Publish Android APK release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to publish (for example v2.3.42)
        required: true
        type: string
      artifact_base_url:
        description: Temporary HTTPS base URL containing the five APKs and versioned SHA256SUMS file
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Derive and validate release version
        id: meta
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $TAG_NAME"; exit 1; }
          [[ -f "release/RELEASE_NOTES_${VERSION}.md" ]] || { echo "Missing release notes for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download and verify release assets
        id: assets
        env:
          BASE_URL: ${{ inputs.artifact_base_url }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$BASE_URL" == https://* ]] || { echo 'artifact_base_url must use HTTPS'; exit 1; }
          mkdir -p dist
          files=(
            "AICP-VPN_${VERSION}_r1_arm64-v8a.apk"
            "AICP-VPN_${VERSION}_r1_armeabi-v7a.apk"
            "AICP-VPN_${VERSION}_r1_universal.apk"
            "AICP-VPN_${VERSION}_r1_x86.apk"
            "AICP-VPN_${VERSION}_r1_x86_64.apk"
            "SHA256SUMS_${VERSION}_r1.txt"
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 600 "$BASE_URL/$file" -o "dist/$file"
          done
          (cd dist && sha256sum --check "SHA256SUMS_${VERSION}_r1.txt")
          manifest="RELEASE_MANIFEST_${VERSION}_r1.txt"
          if curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 "$BASE_URL/$manifest" -o "dist/$manifest"; then
            echo "manifest=dist/$manifest" >> "$GITHUB_OUTPUT"
          else
            rm -f "dist/$manifest"
            echo 'manifest=' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release and APK assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: main
          name: AICP VPN ${{ steps.meta.outputs.version }}
          body_path: release/RELEASE_NOTES_${{ steps.meta.outputs.version }}.md
          files: |
            dist/*.apk
            dist/SHA256SUMS_${{ steps.meta.outputs.version }}_r1.txt
            ${{ steps.assets.outputs.manifest }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
