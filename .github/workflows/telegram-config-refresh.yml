name: AICP VPN Telegram Config Feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-config-refresh.yml"
      - "config/telegram-sources.json"
      - "scripts/telegram_config_engine.py"
      - "scripts/telegram_source_intelligence.py"
      - "scripts/external_source_intelligence.py"
      - "scripts/verify_external_configs.py"
      - "scripts/merge_external_verified.py"
      - "scripts/install_pinned_sing_box.sh"
      - "scripts/publish_telegram_config_feed.sh"
      - "tests/test_telegram_config_engine.py"
      - "tests/test_telegram_source_intelligence.py"
      - "tests/test_external_source_intelligence.py"
      - "tests/test_merge_external_verified.py"
      - "tests/test_telegram_config_engine.py"
      - "docs/EXTERNAL-SOURCE-INTELLIGENCE.md"
      - "deploy/systemd/aicp-vpn-source-intelligence.service"
permissions:
  contents: write
concurrency:
  group: aicp-vpn-telegram-config-feed
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Compile Python tools
        run: python -m py_compile scripts/*.py
      - name: Validate shell scripts
        run: bash -n scripts/publish_telegram_config_feed.sh scripts/install_pinned_sing_box.sh
      - name: Run source intelligence (bounded TCP qualification)
        run: |
          mkdir -p "$RUNNER_TEMP/source-intelligence"
          python scripts/telegram_source_intelligence.py \
            --catalog config/telegram-sources.json \
            --history "$RUNNER_TEMP/source-intelligence/history.jsonl" \
            --registry "$RUNNER_TEMP/source-intelligence/discovered-sources.json" \
            --report "$RUNNER_TEMP/telegram-source-intelligence.json" \
            --effective-catalog "$RUNNER_TEMP/rotated-sources.json" \
            --validated-uris-output "$RUNNER_TEMP/validated-uris.json" \
            --no-discovery
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(1 if d.get("rotation",{}).get("blocked") else 0)' "$RUNNER_TEMP/telegram-source-intelligence.json"
      - name: Collect current Telegram profiles
        run: |
          python scripts/telegram_config_engine.py \
            --validated-uris "$RUNNER_TEMP/validated-uris.json" \
            --intelligence-report "$RUNNER_TEMP/telegram-source-intelligence.json" \
            --output "$RUNNER_TEMP/telegram-all.txt" \
            --manifest "$RUNNER_TEMP/telegram-all.json"
      - name: Publish rolling snapshot
        if: github.event_name == 'workflow_dispatch'
        env:
          FEED_DIR: ${{ runner.temp }}/feed-worktree
        run: |
          git worktree add --detach "$FEED_DIR" "$GITHUB_SHA"
          git -C "$FEED_DIR" switch --orphan feed-snapshot
          git -C "$FEED_DIR" rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$FEED_DIR/feed"
          cp "$RUNNER_TEMP/telegram-all.txt" "$FEED_DIR/feed/telegram-all.txt"
          cp "$RUNNER_TEMP/telegram-all.json" "$FEED_DIR/feed/telegram-all.json"
          cp "$RUNNER_TEMP/telegram-source-intelligence.json" "$FEED_DIR/feed/telegram-source-intelligence.json"
          git -C "$FEED_DIR" add feed/telegram-all.txt feed/telegram-all.json feed/telegram-source-intelligence.json
          git -C "$FEED_DIR" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(vpn-feed): refresh rolling Telegram snapshot"
          git -C "$FEED_DIR" push --force origin HEAD:refs/heads/config-feed
